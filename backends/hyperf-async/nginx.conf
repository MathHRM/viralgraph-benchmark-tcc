worker_processes 1;
events { worker_connections 4096; }
http {
    access_log off;
    upstream api {
        server api1:9501;
        server api2:9501;
        keepalive 32;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}

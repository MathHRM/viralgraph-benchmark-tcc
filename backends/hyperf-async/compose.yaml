name: tcc-hyperf-async
x-app: &app
  image: tcc-hyperf-async:local
  restart: unless-stopped
  environment: &env
    NEO4J_URL: http://neo4j:7474
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-benchmark-local}
    NEO4J_POOL_SIZE: ${NEO4J_POOL_SIZE:-32}
    FEED_PARALLEL: ${FEED_PARALLEL:-false}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: benchmark
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-benchmark-local}
    REFERENCE_DATE: ${REFERENCE_DATE:-2026-11-08}
    BATCH_SIZE: ${BATCH_SIZE:-100}
    FLUSH_MS: ${FLUSH_MS:-5}
    DISTRIBUTION_SLICE_MS: ${DISTRIBUTION_SLICE_MS:-50}
  depends_on:
    api1: {condition: service_healthy}
  ulimits:
    nofile:
      soft: 8192
      hard: 8192
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9501/metricas') === false ? 1 : 0);"]
    interval: 10s
    timeout: 5s
    retries: 12
services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports: ["127.0.0.1:9999:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    cpus: ${NGINX_CPUS:-0.10}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    mem_limit: ${NGINX_MEMORY:-64m}
    memswap_limit: ${NGINX_MEMORY:-64m}
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/metricas"]
      interval: 10s
      timeout: 5s
      retries: 6
  api1:
    <<: *app
    build: .
    environment:
      <<: *env
      INIT_SCHEMA: "1"
    depends_on:
      neo4j: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    cpus: ${API_CPUS:-0.20}
    mem_limit: ${API_MEMORY:-320m}
    memswap_limit: ${API_MEMORY:-320m}
  api2:
    <<: *app
    cpus: ${API_CPUS:-0.20}
    mem_limit: ${API_MEMORY:-320m}
    memswap_limit: ${API_MEMORY:-320m}
  worker:
    <<: *app
    command: ["php", "bin/worker.php"]
    cpus: ${WORKER_CPUS:-0.30}
    mem_limit: ${WORKER_MEMORY:-384m}
    memswap_limit: ${WORKER_MEMORY:-384m}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(time()-(@filemtime('/app/runtime/worker-heartbeat') ?: 0)>60 ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
  rabbitmq:
    image: rabbitmq:4.1.8@sha256:410a1c8844e9c9227f72735d95a391fca4559ca8b61cce9dad707ce5e2229a3a
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: benchmark
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-benchmark-local}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 4"
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1 +A 1"
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    cpus: ${RABBITMQ_CPUS:-0.20}
    mem_limit: ${RABBITMQ_MEMORY:-512m}
    memswap_limit: ${RABBITMQ_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 5s
      retries: 12
  neo4j:
    image: neo4j:5.26.32-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-benchmark-local}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_jvm_additional: "-XX:ActiveProcessorCount=1"
      # ActiveProcessorCount=1 reduz o Jetty a uma thread; a API HTTP serializaria todas as transações.
      NEO4J_server_threads_worker__count: ${NEO4J_HTTP_THREADS:-32}
    volumes: ["neo4j:/data"]
    cpus: ${NEO4J_CPUS:-0.50}
    mem_limit: ${NEO4J_MEMORY:-1400m}
    memswap_limit: ${NEO4J_MEMORY:-1400m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
volumes:
  rabbitmq:
  neo4j:

services:
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    command: ["run", "--no-usage-report", "/scripts/carga.js"]
    environment:
      URL: ${URL:-http://host.docker.internal:8000/api/health}
      RPS: ${RPS:-500}
      DURATION: ${DURATION:-30s}
      VUS: ${VUS:-100}
      MAX_VUS: ${MAX_VUS:-500}
    volumes:
      - .:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

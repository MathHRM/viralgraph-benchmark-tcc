name: tcc-sync
services:
  app:
    build: ./laravel
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      # Chave pública apenas para o ambiente local descartável.
      APP_KEY: ${DOCKER_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-tcc}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-tcc}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-tcc-local-password}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    labels:
      metrics.architecture: synchronous
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    cpus: ${WEB_CPUS:-0.25}
    mem_limit: ${WEB_MEMORY:-128m}
    memswap_limit: ${WEB_MEMORY:-128m}
    labels:
      metrics.architecture: synchronous
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      - ./laravel/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  mysql:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    cpus: ${MYSQL_CPUS:-2}
    mem_limit: ${MYSQL_MEMORY:-2048m}
    memswap_limit: ${MYSQL_MEMORY:-2048m}
    labels:
      metrics.architecture: synchronous
    command: ["--innodb-buffer-pool-size=512M", "--max-connections=100"]
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-tcc}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-tcc}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-tcc-local-password}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root-local-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
volumes:
  mysql-data:

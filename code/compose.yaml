# Configuração comum; combine com um dos overrides de arquitetura.
services:
  app:
    working_dir: /app
    cpus: ${APP_CPUS:-1}
    mem_limit: ${APP_MEMORY:-512m}
    memswap_limit: ${APP_MEMORY:-512m}
    labels:
      metrics.architecture: asynchronous
  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.1
    cpus: ${CADVISOR_CPUS:-0.25}
    mem_limit: ${CADVISOR_MEMORY:-128m}
    memswap_limit: ${CADVISOR_MEMORY:-128m}
    command:
      - --docker_only=true
      - --docker=unix:///var/run/docker.sock
      - --store_container_labels=true
      - --whitelisted_container_labels=metrics.architecture
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    cpus: ${PROMETHEUS_CPUS:-0.25}
    mem_limit: ${PROMETHEUS_MEMORY:-256m}
    memswap_limit: ${PROMETHEUS_MEMORY:-256m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      cadvisor:
        condition: service_started
volumes:
  prometheus-data:

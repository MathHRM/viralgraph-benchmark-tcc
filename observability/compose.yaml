# Observabilidade fora do orçamento de recursos das arquiteturas (1,5 CPU / 3 GB).
# Prometheus e Grafana usam a rede do host para alcançar o k6 (remote write), o endpoint
# Prometheus do RabbitMQ (127.0.0.1:15692) e o cAdvisor (127.0.0.1:8088).
name: tcc-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      retries: 12
  grafana:
    image: grafana/grafana:12.1.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: {condition: service_healthy}
  cadvisor:
    # CPU/memória por container (inclui os limites de cada componente das arquiteturas).
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    ports: ["127.0.0.1:8088:8080"]
    privileged: true
    devices: ["/dev/kmsg"]
    command: ["--docker_only=true", "--housekeeping_interval=2s", "--store_container_labels=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
volumes:
  prometheus:

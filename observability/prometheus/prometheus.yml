global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: rabbitmq
    # per-object: rabbitmq_queue_messages{queue=...} por fila (posts, distribution, shares).
    metrics_path: /metrics/per-object
    static_configs: [{targets: ["127.0.0.1:15692"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["127.0.0.1:8088"]}]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: tcc-viral-.*
        action: keep
# k6 envia via remote write (k6 run -o experimental-prometheus-rw), sem scrape.
